<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partículas con las manos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; font-family: Segoe UI, system-ui, sans-serif; color: #cfe; }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); text-align: center; pointer-events: none; }
    #gesto { font-size: 18px; color: #7dff9a; text-shadow: 0 0 10px #2f6; }
    #estado { font-size: 12px; opacity: .6; margin-top: 4px; }
    #cam { position: fixed; left: 16px; bottom: 16px; width: 200px; height: 150px; border-radius: 8px; overflow: hidden; opacity: .75; display: none; border: 1px solid #2f6a; }
    #cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
    #start { position: fixed; top: 16px; left: 16px; padding: 10px 16px; background: #0b2a1a; color: #7dff9a; border: 1px solid #2f6; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #start:hover { background: #124a2d; }
    #ayuda { position: fixed; top: 16px; right: 16px; font-size: 12px; line-height: 1.6; opacity: .65; text-align: right; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <button id="start">Activar cámara</button>
  <div id="ayuda">
    Mano abierta: anillo · Puño: esfera<br>
    Dos dedos: estela · "L" o rock: lluvia de cruces<br>
    Dos manos: el tamaño sigue la distancia<br>
    Sin cámara: teclas 1-4 y el ratón
  </div>
  <div id="cam"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
  <div id="hud"><div id="gesto">sin mano</div><div id="estado"></div></div>
  <script type="module" src="main.js"></script>
</body>
</html>
